# ============================================================
# Alembic Configuration — Shackles Symposium
# ============================================================
# Docs: https://alembic.sqlalchemy.org/en/latest/tutorial.html
#
# IMPORTANT:
#   - The `sqlalchemy.url` is left empty on purpose.
#   - The actual URL is loaded from `settings.database_url` in
#     `alembic/env.py`, which reads from your `.env` file.
#   - This means you never commit credentials to this file.
# ============================================================

[alembic]
# Path to the Alembic scripts directory (relative to this file)
script_location = alembic

# Add src/ to Python's import path so `import shackles` works
# without needing to install the package first
prepend_sys_path = src

# Path separator used in version file names
# "os" = use the OS default (helpful on Windows)
path_separator = os

# Don't include the timezone in generated migration filenames
# (set to "true" if you want timezone-aware timestamps)
# timezone =

# Timestamp + revision format for migration filenames.
# Produces files like: 20261005_1430_add_user_table.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s

# Truncate the slug portion of the filename
truncate_slug_length = 40

# Uncomment to compare server defaults (nullable, etc.) during autogenerate
# compare_server_default = true

# Leave this EMPTY — env.py sets it dynamically from settings
sqlalchemy.url =

# ------------------------------------------------------------
# Logging configuration
# ------------------------------------------------------------
# Alembic uses Python's standard logging module.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S